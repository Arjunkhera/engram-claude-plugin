name: atlas-upkeep
# The Atlas upkeep check on each pull request: plain code, no model and no
# secret. `atlas tooling` wrote this file from the Atlas package; do not edit
# it by hand. A newer Atlas moves the pin below when `atlas tooling pr` runs.
#
# It stops drift at its source: the docs index lists each doc, every doc link
# resolves, each doc names its code, and the pull request names its tracker
# item, or says "no item:" and a reason. A repo with no docs/ folder passes
# the index part with one line.
#
# It runs a pinned Atlas release from npm, never code of the pull request. It
# runs on pull_request, not pull_request_target, so it holds only a read token
# and no secret, also for a pull request from a fork. npx runs outside the
# checkout, so an .npmrc in the pull request cannot pick the registry.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: atlas-upkeep-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  upkeep:
    name: docs · upkeep check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      # actions/setup-node v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.22.0"
      - name: Upkeep check
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          npx --yes --ignore-scripts @arjunkhera/atlas@0.4.55 upkeep check --root "$GITHUB_WORKSPACE" --event "$GITHUB_EVENT_PATH" | tee -a "$GITHUB_STEP_SUMMARY"
